name: CI

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build java app
    environment: values
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: setup java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      
      - name: check java version
        run: java -version && mvn -version
      
      - name: Build with Maven
        run: mvn clean install

      - name: login to docker 
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            binitmaharjan/github-action-learn-demo2:latest
            binitmaharjan/github-action-learn-demo2:${{ github.sha }}
            binitmaharjan/github-action-learn-demo2:${{ github.run_number }}



